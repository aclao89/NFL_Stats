name: Gridiron app checks
on:
  push:
    paths: ['gridiron-app/**', '.github/workflows/gridiron-*.yml']
  pull_request:
    paths: ['gridiron-app/**', '.github/workflows/gridiron-*.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gridiron-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: gridiron-app/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --test tests/*.test.mjs
      - run: python -m gridiron.validate web/data

name: Refresh Gridiron NFL data
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gridiron-refresh.yml'
      - 'gridiron-app/gridiron/**'
      - 'gridiron-app/requirements.txt'
  schedule:
    # Tuesday after MNF; Thursday after midweek stat corrections. Times are UTC.
    - cron: '17 12 * * 2,4'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gridiron-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gridiron-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: gridiron-app/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --test tests/*.test.mjs
      - name: Fetch historical and current-season stats; retrain and evaluate
        run: python -m gridiron.refresh --force
      - run: python -m gridiron.validate web/data
      - name: Publish the verified snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          if ! git diff --cached --quiet; then
            git commit -m "Refresh NFL stats and historical model snapshot"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: gridiron-app
          path: gridiron-app/web/
